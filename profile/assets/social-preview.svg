<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="OctoClaw Labs social preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#3b1f5e"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3b1f5e"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Big octopus head (right) -->
  <g transform="translate(1020, 320)" opacity="0.25">
    <circle r="100" fill="#7c3aed"/>
    <circle cx="-30" cy="-20" r="12" fill="#fef3c7"/>
    <circle cx="30" cy="-20" r="12" fill="#fef3c7"/>
    <!-- 8 tentacles -->
    <g stroke="#7c3aed" stroke-width="20" stroke-linecap="round" fill="none">
      <path d="M 0,0 C 50,-80 90,-100 140,-130"/>
      <path d="M 0,0 C 70,-50 120,-70 180,-80"/>
      <path d="M 0,0 C 80,50 130,70 190,80"/>
      <path d="M 0,0 C 50,80 90,100 140,130"/>
      <path d="M 0,0 C -50,-80 -90,-100 -140,-130"/>
      <path d="M 0,0 C -70,-50 -120,-70 -180,-80"/>
      <path d="M 0,0 C -80,50 -130,70 -190,80"/>
      <path d="M 0,0 C -50,80 -90,100 -140,130"/>
    </g>
  </g>

  <!-- Title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="120" font-weight="800" fill="url(#title)" letter-spacing="-3">OctoClaw Labs</text>

  <!-- Subtitle -->
  <text x="104" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="400" fill="#e9d5ff" letter-spacing="0.5">
    AI Agent execution engine · cloud to edge
  </text>

  <!-- Tagline -->
  <text x="104" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="300" fill="#c084fc" letter-spacing="2">
    Zero-trust · Streaming · Sub-second · MCP-native
  </text>

  <!-- Partme-AI badge -->
  <g transform="translate(104, 460)">
    <rect x="0" y="0" width="320" height="50" rx="25" fill="#6366f1"/>
    <text x="160" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">
      Part of partme-ai ecosystem
    </text>
  </g>

  <rect x="0" y="628" width="1280" height="12" fill="url(#title)"/>
</svg>